  2024-29699:
    v1_2_scope: {product_lines: [disputes], product_lines_basis: primary, segments: [bank, credit_union], segments_unclear: [captive, specialty_lender], segments_source: register_rows, priority: high}
    review:
      decision: relevant
      reviewer: Angela
      date: 2026-09-27
      reason: "Relevant as published under the v1.2 scope: the rule extended card dispute rights (Regulation Z claims and defenses and billing-error resolution) to overdraft credit at very large banks and credit unions. v1.2 scope expansion; the v1 eval label (N) and scores are unchanged."
      close:
        reason: "reported disapproved by Congress in 2025 under the Congressional Review Act; not confirmed from committed data"
      notes:
        - "2026-09-27 (Angela): disapproval confirmed. S.J.Res. 18, signed into law as P.L. 119-10 (139 Stat. 53) on May 9, 2025, disapproved the rule: \"such rule shall have no force or effect\" (GovInfo text committed at data/raw/primary/govinfo/PLAW-119publ10.htm.gz). The CFPB states the final rule has no force or effect while the rest of Regulations E and Z remain in force (reviewer's source). eCFR still showing 12 CFR 1026.62 is an eCFR lag. The signed record file is not edited; the confirmation is kept here and in REVIEW_LOG.md."
      record:
        affected_register_rows: [REGZ-CLAIMS-001, REGZ-BILLERR-001]
        what_changed: "CFPB final rule (89 FR 106768; effective October 1, 2025 as published) amending Regulations E and Z so that overdraft credit from very large financial institutions (over $10 billion in assets) is consumer credit under Regulation Z unless the fee only recovers estimated costs and losses (new 12 CFR 1026.62; changes to 1026.1-1026.4, 1026.42, 1026.60, the Regulation Z commentary, and 1005.10(e)(1) and its commentary). Above-breakeven overdraft credit accessed by a hybrid debit-credit card is brought under the credit card provisions, including the cardholder's right to assert claims and defenses against the card issuer (1026.12(c)) and billing-error resolution (1026.13). The committed eCFR store shows 12 CFR 1026.62 text in effect on 2025-10-01; no later document in the store disapproves or removes the rule."
        compliant_agent_must_now: "No agent change while the record is closed. If the rule is confirmed in force at a bank or credit union client over $10 billion, an agent handling disputes on above-breakeven overdraft credit would route them through Regulation Z billing-error and claims-and-defenses procedures, and must not require automatic repayment as a condition of that credit (1005.10(e)(1))."
        open_questions_for_deploying_team:
          - "Is the rule in force? It is reported disapproved under the Congressional Review Act in 2025, but no committed document confirms that, and the committed eCFR text shows 12 CFR 1026.62 added on 2025-10-01."
          - "Which bank and credit union clients exceed $10 billion in assets and offer overdraft credit through accounts the agent services?"
    change_type: final_rule
    change_type_reason: "Final rule as published; human review override"
    behavior_classes_primary: [DISPUTES.CLAIMS_DEFENSES, DISPUTES.ERROR_RESOLUTION]
    behavior_classes_secondary: [PAYMENT.AUTHORIZATION]
    superseded_by:
      - doc_id: "P.L. 119-10"
        relation: disapproval
        external: true
        source: "GovInfo PLAW-119publ10 (139 Stat. 53, May 9, 2025), text in data/raw/primary/govinfo/PLAW-119publ10.htm.gz; found by pipeline.cra"
        note: "S.J.Res. 18 disapproves the rule (89 Fed. Reg. 106768) under the Congressional Review Act; \"such rule shall have no force or effect\". Linked in metadata only: the record is signed and already closed."
