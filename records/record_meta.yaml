      record:
        affected_register_rows: []
        what_changed: "NCUA final rule, effective July 16, 2026, replacing 12 CFR part 749 with a vital records preservation program: 749.1 defines vital records (e.g. current share, deposit and loan balances by member); 749.2 requires a written program with a storage and destruction schedule and a records preservation log in any format; 749.3 requires oversight of any third-party service provider maintaining vital records; 749.4-749.5 allow any accurate, reproducible format. Appendix A (Record Retention Guidelines) and Appendix B are repealed from the CFR, and 12 CFR 703.105(d) is removed. 749.0(b): other records preservation requirements are not superseded."
        compliant_agent_must_now: "No agent behavior change. Control validation from July 16, 2026: credit union client retention schedules that relied on the repealed Appendix A must rest on the retention rules that bind them (e.g. 12 CFR 1005.13, 1026.25, 1002.12, and 1006.100 where collection rules apply); if the deployment maintains any credit union vital records (e.g. loan balance lists), expect 749.3 oversight."
