# Operational metadata for change records (v1.1).
#
# The model's triage outputs in data/triage/ are never edited. This file holds what
# the records add on top of them; `python -m pipeline.records annotate` applies it to
# records/<doc_id>.md, and `python -m pipeline.records check` validates it.
#
# supersedes / superseded_by: links between a record and a later (or earlier) Federal
# Register document that withdraws, finalizes, disapproves, vacates, amends or corrects
# it. relation is one of: withdrawal, final_rule, disapproval, vacatur (these close or
# reverse the earlier record), amends, correction (the earlier record stays open).
# Links are made only where the other document is in the ingested store
# (data/raw/federal_register.jsonl.gz); each note says where the link is stated.
# Exception: a court decision outside the Federal Register (e.g. a vacatur) is linked
# with external: true and a source naming who established it; it is not in the store.
#
# change_type: the v1.1 change type for the record, where it differs from the v1 triage
# output (which stays as it was). `interpretation` means control validation: check
# existing controls against the stated interpretation (pipeline/triage_prompt.md).
# change_type_reason says which v1.1 category applies.
#
# behavior_classes_primary / behavior_classes_secondary: the v1.1 split of the record's
# classes. Primary: the document changes or clarifies what the agent must do; these drive
# routing and review. Secondary: touched without changing the agent's obligations; context
# only. Re-tagging splits the model's v1 classes and adds or drops none (checked); for a
# proposal, primary is what the proposal would change. tagging_note explains a record
# with no primary class.
#
# review: a human review override of the model's answer (decision relevant or
# not_relevant, reviewer, date, reason). A not_relevant decision fills the record's
# sign-off and closes it. A relevant decision on a document the model called not
# relevant creates its record from committed metadata, with record fields from the
# review. Every override is also logged in records/REVIEW_LOG.md.

