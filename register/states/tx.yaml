rows:
  - id: TX-TDCA-001
    law: "Texas Debt Collection Act"
    citation: "Tex. Fin. Code 392.302(4)"
    source_url: "https://statutes.capitol.texas.gov/Docs/FI/htm/FI.392.htm#392.302"
    agency: state
    jurisdiction: US-TX
    applies_to: [first_party_creditors, third_party_collectors]
    tier: 1
    behavior_classes: [CONTACT.FREQUENCY]
    constraint: "Do not cause a telephone to ring repeatedly or continuously, or make repeated or continuous calls, with intent to harass a person at the called number. TDCA 'debt collector' includes creditors collecting their own debts."
