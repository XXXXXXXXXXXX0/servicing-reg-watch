  - id: TX-TDCA-003
    law: "Texas Debt Collection Act"
    citation: "Tex. Fin. Code 392.304(a)(8), (a)(19)"
    source_url: "https://statutes.capitol.texas.gov/Docs/FI/htm/FI.392.htm#392.304"
    agency: state
    jurisdiction: US-TX
    applies_to: [first_party_creditors, third_party_collectors]
    tier: 1
    behavior_classes: [NEGOTIATION.TREATMENT]
