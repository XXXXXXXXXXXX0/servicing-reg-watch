# Texas state-layer rows (BUILD_SPEC 6.3). All rows status: verify.
rows:
  - id: TX-TDCA-001
    law: "Texas Debt Collection Act"
    citation: "Tex. Fin. Code 392.302(4)"
    source_url: "https://statutes.capitol.texas.gov/Docs/FI/htm/FI.392.htm#392.302"
    agency: state
    jurisdiction: US-TX
    applies_to: [first_party_creditors, third_party_collectors]
    tier: 1
    behavior_classes: [CONTACT.FREQUENCY]
    constraint: "Do not cause a telephone to ring repeatedly or continuously, or make repeated or continuous calls, with intent to harass a person at the called number. TDCA 'debt collector' includes creditors collecting their own debts."
    change_source: [manual]
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null

  - id: TX-TDCA-002
    law: "Texas Debt Collection Act"
    citation: "Tex. Fin. Code 392.304(a)(5)"
    source_url: "https://statutes.capitol.texas.gov/Docs/FI/htm/FI.392.htm#392.304"
    agency: state
    jurisdiction: US-TX
    applies_to: [third_party_collectors]
    tier: 1
    behavior_classes: [DISCLOSURE.REQUIRED]
    constraint: "Third-party debt collectors must disclose in communications that they are attempting to collect a debt. This provision does not reach first-party creditors."
    change_source: [manual]
    provenance: salient_stated
