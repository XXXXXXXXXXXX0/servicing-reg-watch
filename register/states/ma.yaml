  - id: MA-CURE-001
    law: "Massachusetts Motor Vehicle Retail Installment Sales Act (right to cure)"
    citation: "M.G.L. c. 255B, § 20A"
    source_url: "https://malegislature.gov/Laws/GeneralLaws/PartI/TitleXX/Chapter255B/Section20A"
    agency: state
    jurisdiction: US-MA
    applies_to: [creditors, secured_parties]
    tier: 2
    behavior_classes: [RECOVERY.REPOSSESSION]
    constraint: "Before accelerating or repossessing after default on a covered motor vehicle contract, the creditor must send a notice of default and right to cure and let the cure period run."
    change_source: [manual]
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null

