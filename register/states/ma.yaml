  - id: MA-REC-001
    law: "Massachusetts Wiretap Act"
    citation: "M.G.L. c. 272, § 99"
    source_url: "https://malegislature.gov/Laws/GeneralLaws/PartIV/TitleI/Chapter272/Section99"
    agency: state
    jurisdiction: US-MA
    applies_to: [all_persons]
    tier: 1
    behavior_classes: [CONTACT.RECORDING]
    constraint: "Secret recording of a wire or oral communication is prohibited, which in effect requires all-party knowledge. Disclose recording at the start of the call."
    change_source: [manual]
    provenance: added_by_analysis
    provenance_url: null
    status: machine_verified
    effective_date: null
    last_checked: null
    machine_check:
      result: match
      date: '2026-09-27'
      sources:
      - data/raw/primary/ma/c272-s99.htm.gz
      note: 'Section 99(B)(4): ''interception'' means to secretly hear or secretly record ... by any person other than a person given prior authority by all parties.'
    federal_interaction_note: No federal recording-consent row in the register (the federal wiretap statute is not modeled), so there is no federal row to compare.

  - id: MA-CURE-001
    law: "Massachusetts Motor Vehicle Retail Installment Sales Act (right to cure)"
    citation: "M.G.L. c. 255B, § 20A"
    source_url: "https://malegislature.gov/Laws/GeneralLaws/PartIII/TitleIV/Chapter255B/Section20A"
    agency: state
    jurisdiction: US-MA
    applies_to: [creditors, secured_parties]
    tier: 2
    behavior_classes: [RECOVERY.REPOSSESSION]
    constraint: "Before accelerating or repossessing after default on a covered motor vehicle contract, the creditor must send a notice of default and right to cure and let the cure period run."
    change_source: [manual]
    provenance: salient_stated
    provenance_url: null
    status: machine_verified
    effective_date: null
    last_checked: null
    machine_check:
      result: match
      date: '2026-09-27'
      sources:
      - data/raw/primary/ma/c255B-s20A.htm.gz
      note: '20A(c)-(d): written notice given 10 or more days after default; 21-day cure period during which the creditor may not accelerate or take possession because of that default. No notice is needed for a later default after three cures (20A(b)). The row''s source_url returned 404; corrected to the Part III, Title IV path.'
    federal_interaction:
    - row: SCRA-REPO-001
      stricter: different_scope
      note: Adds a pre-repossession cure notice, which no federal row requires; SCRA and the bankruptcy stay apply on top.
    - row: BK-STAY-001
      stricter: different_scope
      note: Repossession is stayed once a petition is filed, whatever the cure period.

  - id: MA-DEFICIENCY-001
    law: "Massachusetts Motor Vehicle Retail Installment Sales Act (deficiency)"
    citation: "M.G.L. c. 255B, § 20B"
    source_url: "https://malegislature.gov/Laws/GeneralLaws/PartIII/TitleIV/Chapter255B/Section20B"
    agency: state
    jurisdiction: US-MA
    applies_to: [creditors, secured_parties]
    tier: 2
    behavior_classes: [RECOVERY.REPOSSESSION]
    constraint: "Limits deficiency claims after repossession: measured against fair market value, and barred below a statutory balance threshold. Confirm the threshold against primary text."
    change_source: [manual]
    provenance: salient_stated
    provenance_url: null
    status: machine_verified
    effective_date: null
    last_checked: null
    machine_check:
      result: match
      date: '2026-09-27'
      sources:
      - data/raw/primary/ma/c255B-s20B.htm.gz
      note: 'Threshold confirmed: no deficiency if the unpaid balance was $2,000 or less (20B(d)); at $2,000 or more, the deficiency is the unpaid balance less the collateral''s fair market value, plus reasonable repossession and storage costs (20B(e)(1)). The row''s source_url returned 404; corrected to the Part III, Title IV path.'
    federal_interaction:
    - row: UDAAP-PAYOFF-001
      stricter: different_scope
      note: UDAAP-PAYOFF-001 concerns unearned add-on refunds that inflate deficiency balances; the state rule caps the deficiency itself.

