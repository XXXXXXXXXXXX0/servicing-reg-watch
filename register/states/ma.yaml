  - id: MA-REC-001
    law: "Massachusetts Wiretap Act"
    citation: "M.G.L. c. 272, § 99"
    source_url: "https://malegislature.gov/Laws/GeneralLaws/PartIV/TitleI/Chapter272/Section99"
    agency: state
