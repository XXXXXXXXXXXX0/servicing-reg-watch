rows:
  - id: MA-940CMR-001
    law: "Massachusetts AG Debt Collection Regulations (creditors)"
    citation: "940 CMR 7.04(1)(f)"
    source_url: "https://www.mass.gov/regulations/940-CMR-700-debt-collection-regulations"
    agency: state
    jurisdiction: US-MA
    applies_to: [first_party_creditors]
    tier: 1
    behavior_classes: [CONTACT.FREQUENCY]
    constraint: "Creditors may initiate no more than two telephone communications in each seven-day period to the debtor's residence, cell phone, or other personal number provided by the debtor, per debt. Workplace calls are limited to two in each 30-day period."
    change_source: [manual]
    provenance: salient_stated
    provenance_url: null
    status: verified
    effective_date: null
    last_checked: 2026-09-27
    notes: "Third-party collectors are regulated separately (209 CMR 18.00); not yet modeled."
    machine_check:
      result: not_checkable
      date: '2026-09-27'
      reason: source blocked
      sources:
      - 'not fetched: https://www.mass.gov/regulations/940-CMR-700-debt-collection-regulations (www.mass.gov answered 403 (''Not allowed'') to automated requests on 2026-09-27)'
      note: www.mass.gov returns 'Not allowed' (HTTP 403) to automated requests; 940 CMR 7.00 is not on malegislature.gov. The two-calls-in-seven-days limit is unconfirmed.
    federal_interaction:
    - row: REGF-FREQ-001
      stricter: stricter
      note: 'Hand-checked by the reviewer against 940 CMR 7.04 on 2026-09-27: two calls per seven days per debt versus the Regulation F seven-in-seven presumption, and it reaches first-party creditors. 12 CFR 1006.104 allows more protective state law.'
    human_check:
