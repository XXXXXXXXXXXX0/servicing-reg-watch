# California state-layer rows (BUILD_SPEC 6.3). All rows status: verify.
# Drafted without access to primary text; check each citation before relying on it.
rows:
  - id: CA-ROSENTHAL-001
    law: "Rosenthal Fair Debt Collection Practices Act"
    citation: "Cal. Civ. Code 1788.17; 1788.2(c)"
    source_url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1788.17"
    agency: state
    jurisdiction: US-CA
    applies_to: [first_party_creditors, third_party_collectors]
    tier: 1
    behavior_classes: [CONTACT.TIMING, CONTACT.FREQUENCY, DISCLOSURE.REQUIRED, IDENTITY.RIGHT_PARTY, STOP.TRIGGERS]
    constraint: "Rosenthal's 'debt collector' is any person who regularly engages in debt collection on behalf of that person or others (1788.2(c)), so it includes creditors collecting their own consumer debts. Section 1788.17 requires every debt collector to comply with FDCPA 15 U.S.C. 1692b-1692j and subjects it to 1692k, which carries the federal timing, third-party and cease rules to first-party lenders in California. Section 1788.17 exempts first-party creditors (the persons in 15 U.S.C. 1692a(6)(A)-(B) and their principals) from 1692e(11) and 1692g, and incorporates the FDCPA as it read on January 1, 2001, not Regulation F."
    change_source: [manual]
    provenance: salient_stated
    provenance_url: null
    status: machine_verified
    effective_date: null
    last_checked: null
    machine_check:
      result: match
      date: '2026-09-27'
      sources:
      - data/raw/primary/ca/CIV-1788.17.htm.gz
      - data/raw/primary/ca/CIV-1788.2.htm.gz
      note: 'Re-checked 2026-09-27 after the reviewer''s fix: 1788.2(c) definition; 1788.17 incorporation of 1692b-1692j and 1692k, the exemption of 1692a(6)(A)-(B) persons and their principals from 1692e(11) and 1692g, and ''The references to federal codes in this section refer to those codes as they read January 1, 2001.'' Section amended by Stats. 2024, ch. 522 (SB 1286), effective January 1, 2025. Earlier result: mismatch (said disclosure rules reached first-party lenders).'
    federal_interaction:
    - row: REGF-TIME-001
      stricter: different_scope
      note: Extends the 1692c(a)(1) time and place rule (statute as of 2001) to first-party creditors, which Regulation F does not reach; same 8 a.m. to 9 p.m. presumption.
    - row: REGF-IDENT-001
      stricter: different_scope
      note: Extends 1692b and 1692c(b) third-party limits to first-party creditors.
    - row: REGF-STOP-001
      stricter: different_scope
      note: Extends the 1692c(c) cease rule to first-party creditors.
    - row: REGF-DISC-001
      stricter: not_stricter
      note: 1692g validation does not apply to first-party creditors through 1788.17.
    - row: REGF-DISC-002
      stricter: not_stricter
      note: 1692e(11) disclosure does not apply to first-party creditors through 1788.17.
    - row: REGF-FREQ-001
      stricter: not_stricter
      note: Incorporates the statute (1692d(5)), not the Regulation F 7-in-7 presumption.

  - id: CA-ROSENTHAL-002
    law: "Rosenthal Fair Debt Collection Practices Act"
    citation: "Cal. Civ. Code 1788.11(d)-(e)"
    source_url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1788.11"
    agency: state
    jurisdiction: US-CA
    applies_to: [first_party_creditors, third_party_collectors]
    tier: 1
    behavior_classes: [CONTACT.FREQUENCY]
    constraint: "Do not cause a telephone to ring repeatedly or continuously to annoy, or communicate by telephone with a frequency that is unreasonable and constitutes harassment under the circumstances."
    change_source: [manual]
    provenance: salient_stated
    provenance_url: null
    status: machine_verified
    effective_date: null
    last_checked: null
    machine_check:
      result: match
      date: '2026-09-27'
      sources:
      - data/raw/primary/ca/CIV-1788.11.htm.gz
      note: 1788.11(e) reaches communication 'by telephone or in person'.
    federal_interaction:
    - row: REGF-FREQ-001
      stricter: different_scope
      note: Reaches first-party creditors; a harassment standard ('unreasonable' frequency) with no numeric cap or presumption.

  - id: CA-ROSENTHAL-003
    law: "Rosenthal Fair Debt Collection Practices Act"
    citation: "Cal. Civ. Code 1788.14(c)"
    source_url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=1788.14"
    agency: state
    jurisdiction: US-CA
    applies_to: [first_party_creditors, third_party_collectors]
    tier: 1
    behavior_classes: [STOP.TRIGGERS]
    constraint: "After written notice that the debtor is represented by an attorney, do not initiate communications with the debtor about the debt, subject to the statute's exceptions."
    change_source: [manual]
    provenance: salient_stated
    provenance_url: null
    status: machine_verified
    effective_date: null
    last_checked: null
    machine_check:
      result: match
      date: '2026-09-27'
      sources:
      - data/raw/primary/ca/CIV-1788.14.htm.gz
      note: 'The trigger in 1788.14(c) is narrower than the row says: written notice from the debtor''s attorney that includes the attorney''s name and address and a request that communications go to the attorney. Statements of account, attorney approval and responses to the debtor''s own inquiries are excepted. The row as written is stricter than the statute.'
    federal_interaction:
    - row: REGF-STOP-002
      stricter: different_scope
      note: Reaches first-party creditors but needs written notice from the attorney; the federal rule (and 1692c(a)(2) via 1788.17 for collectors) turns on knowledge of representation.

  - id: CA-REC-001
    law: "California Invasion of Privacy Act (recording)"
    citation: "Cal. Penal Code 632, 632.7"
    source_url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=PEN&sectionNum=632.7"
    agency: state
    jurisdiction: US-CA
    applies_to: [all_persons]
    tier: 1
    behavior_classes: [CONTACT.RECORDING]
    constraint: "All-party consent. Recording a confidential communication, or any communication involving a cellular or cordless phone, needs the consent of all parties. Disclose recording at the start of the call."
    change_source: [manual]
    provenance: added_by_analysis
    provenance_url: null
    status: machine_verified
    effective_date: null
    last_checked: null
    machine_check:
      result: match
      date: '2026-09-27'
      sources:
      - data/raw/primary/ca/PEN-632.htm.gz
      - data/raw/primary/ca/PEN-632.7.htm.gz
      note: '''Disclose recording at the start of the call'' is operating practice to obtain consent, not statutory text. 632 covers confidential communications; 632.7 covers communications involving cellular or cordless phones, confidential or not.'
    federal_interaction_note: No federal recording-consent row in the register (the federal wiretap statute is not modeled), so there is no federal row to compare.

  - id: CA-AIDISC-001
    law: "California BOT Disclosure Law"
    citation: "Cal. Bus. & Prof. Code 17940-17943"
    source_url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=BPC&sectionNum=17941"
    agency: state
    jurisdiction: US-CA
    applies_to: [bot_operators]
    tier: 2
    behavior_classes: [CONTACT.AI_DISCLOSURE]
    constraint: "It is unlawful to use a bot to communicate with a person in California online with intent to mislead them about its artificial identity in order to incentivize a sale or transaction, unless the bot is disclosed clearly and conspicuously."
    change_source: [manual]
    provenance: added_by_analysis
    provenance_url: null
    status: machine_verified
    effective_date: 2019-07-01
    last_checked: null
    notes: "The statute is framed around 'online' communication. Whether it reaches outbound voice calls is an open question for counsel."
    machine_check:
      result: match
      date: '2026-09-27'
      sources:
      - data/raw/primary/ca/BPC-17940.htm.gz
      - data/raw/primary/ca/BPC-17941.htm.gz
      - data/raw/primary/ca/BPC-17942.htm.gz
      - data/raw/primary/ca/BPC-17943.htm.gz
      note: 17941(a) adds 'for the purpose of knowingly deceiving the person about the content of the communication', and also covers influencing a vote. 'Bot' is 'an automated online account' (17940(a)); 'online' means a public-facing website, web application or digital application (17940(b)). Operative July 1, 2019 (17943).
    federal_interaction:
    - row: TCPA-AIVOICE-001
      stricter: different_scope
      note: 'Disclosure duty for online bots; the TCPA row concerns consent for AI-voice calls. Neither displaces the other (17942(a): duties are cumulative).'

  - id: CA-REPO-001
    law: "Rees-Levering Motor Vehicle Sales and Finance Act"
    citation: "Cal. Civ. Code 2983.2, 2983.3"
    source_url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=CIV&sectionNum=2983.2"
    agency: state
    jurisdiction: US-CA
    applies_to: [secured_parties, creditors]
    tier: 2
    behavior_classes: [RECOVERY.REPOSSESSION]
    constraint: "After repossessing a vehicle under a conditional sale contract, the holder must give a notice of intent to dispose (with reinstatement and redemption rights) at least 15 days before disposition. Deficiency rights depend on compliance."
    change_source: [manual]
    provenance: salient_stated
    provenance_url: null
    status: machine_verified
    effective_date: null
    last_checked: null
    machine_check:
      result: match
      date: '2026-09-27'
      sources:
      - data/raw/primary/ca/CIV-2983.2.htm.gz
      - data/raw/primary/ca/CIV-2983.3.htm.gz
      note: '2983.2(a): deficiency liability requires the notice to be given within 60 days of repossession or surrender. 2983.3(a)(2): a bankruptcy filing is not a default and cannot be the basis for acceleration or repossession.'
    federal_interaction:
    - row: BK-STAY-001
      stricter: different_scope
      note: Adds pre-disposition notice and reinstatement rights; the stay applies on top once a petition is filed.
    - row: SCRA-REPO-001
      stricter: different_scope
      note: Adds state notice duties; the SCRA court-order requirement applies on top for covered servicemembers.

  - id: CA-UCC9-001
    law: "UCC Article 9 (California)"
    citation: "Cal. Com. Code 9609, 9611, 9614, 9615"
    source_url: "https://leginfo.legislature.ca.gov/faces/codes_displaySection.xhtml?lawCode=COM&sectionNum=9609"
    agency: state
    jurisdiction: US-CA
    applies_to: [secured_parties]
    tier: 2
    behavior_classes: [RECOVERY.REPOSSESSION]
    constraint: "Self-help repossession only without breach of the peace. Reasonable authenticated notification before disposition, with consumer-goods content requirements, and application of proceeds and surplus/deficiency explanation."
    change_source: [manual]
    provenance: salient_stated
    provenance_url: null
    status: machine_verified
    effective_date: null
    last_checked: null
    machine_check:
      result: match
      date: '2026-09-27'
      sources:
      - data/raw/primary/ca/COM-9609.htm.gz
      - data/raw/primary/ca/COM-9611.htm.gz
      - data/raw/primary/ca/COM-9614.htm.gz
      - data/raw/primary/ca/COM-9615.htm.gz
      note: California's text now says 'signed notification' where the row says 'authenticated'.
    federal_interaction:
    - row: SCRA-REPO-001
      stricter: different_scope
      note: State self-help and notice rules; SCRA court-order requirement applies on top for covered servicemembers.
    - row: BK-STAY-001
      stricter: different_scope
      note: Repossession and disposition are stayed once a petition is filed.
