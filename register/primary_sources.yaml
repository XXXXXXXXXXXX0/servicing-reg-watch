# Primary text fetched for the register pre-check (machine_check) and the
# preemption fields. `python -m pipeline.verify fetch` fetches every source
# below that is not already in the committed store and writes tag-stripped
# text to data/verify/ (runtime) for review.
#
# Store locations (committed; nothing saved is refetched):
#   ecfr    -> data/raw/ecfr/<ecfr_date>_title-<t>.xml_<params>.gz (the diff step's store)
#   govinfo -> data/raw/govinfo/<document_number>.htm.gz (the ingest step's store)
#   uscode, url -> data/raw/primary/<name>.htm.gz
#
# Kinds:
#   ecfr:    {title, part, section | appendix | subpart}; point-in-time text on ecfr_date
#   uscode:  {title, section}; uscode.house.gov (prelim edition, as served on the fetch date)
#   govinfo: {document_number, publication_date}; Federal Register text from GovInfo
#   url:     {url, name}; state legislature pages and other primary pages
#   blocked: {url, reason}; not fetched (network check failed); rows resting on it are not_checkable

