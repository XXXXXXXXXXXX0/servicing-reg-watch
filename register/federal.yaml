  # --------------------------------- Insurance claims and payoff: UDAAP hooks
  - id: UDAAP-PAYOFF-001
    law: "Consumer Financial Protection Act (UDAAP): payoff and title delivery"
    citation: "12 USC 5531, as applied in CFPB Supervisory Highlights, Special Edition Auto Finance, 89 FR 83842 (Oct. 18, 2024), FR Doc. 2024-24093, secs. 2.3.2 and 2.4.6"
    source_url: "https://www.federalregister.gov/documents/2024/10/18/2024-24093/supervisory-highlights-special-edition-auto-finance"
    agency: CFPB
    jurisdiction: federal
    applies_to: [covered_persons]
    tier: 2
    behavior_classes: [NEGOTIATION.TREATMENT, INSURANCE.CLAIMS]
    constraint: "Supervisory findings of unfair practices: excessive delay delivering vehicle titles after loan or lease payoff or on request to transfer registration out of state (sec. 2.3.2); failing to ensure refunds of unearned add-on product premiums on early payoff, repossession or total loss, which inflated payoff and deficiency balances (sec. 2.4.6). Payoff quotes should reflect refunds due, and post-payoff title release should be tracked to the lender's stated timeline."
    change_source: [federal_register]
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null
    notes: "v1.2. Supervisory findings, not a rule; the sections named were confirmed in the committed GovInfo text of 2024-24093. No payoff-quote timing rule was found in committed federal material; state payoff rules are STATE-PAYOFF-001 (unresearched)."

  - id: UDAAP-INS-001
    law: "Consumer Financial Protection Act (UDAAP): GAP and total-loss handling"
    citation: "12 USC 5531, as applied in CFPB Supervisory Highlights, Special Edition Auto Finance, 89 FR 83842 (Oct. 18, 2024), FR Doc. 2024-24093, secs. 2.4.2, 2.4.6 and 2.4.9"
    source_url: "https://www.federalregister.gov/documents/2024/10/18/2024-24093/supervisory-highlights-special-edition-auto-finance"
    agency: CFPB
    jurisdiction: federal
    applies_to: [covered_persons]
    tier: 2
    behavior_classes: [INSURANCE.CLAIMS, NEGOTIATION.TREATMENT]
    constraint: "Supervisory findings of unfair practices: financing GAP products void on salvage-title vehicles (sec. 2.4.2); failing to ensure refunds of unearned add-on premiums after total loss or default (sec. 2.4.6); continuing to collect monthly payments for months after a total loss from borrowers covered by a GAP waiver, then miscalculating the refund (sec. 2.4.9). After a reported total loss with GAP coverage, an agent should not press for scheduled payments without checking claim status."
    change_source: [federal_register]
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null
    notes: "v1.2. Supervisory findings, not a rule; sections confirmed in the committed GovInfo text of 2024-24093. Overlaps INS-GAP-001 (Issue 26). Appraisal-clause deadlines: INS-APPRAISAL-001 (unresearched)."
