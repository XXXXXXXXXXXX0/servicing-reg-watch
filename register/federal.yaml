# Federal register rows (BUILD_SPEC Sections 4 and 6).
#
# Every row cites a primary source. Every row is `status: verify`: the
# citations, constraint summaries and effective dates were drafted from
# working knowledge of the law without network access to the primary text,
# and must be checked against the linked primary source before they are
# relied on. `last_checked` stays null until someone does that check.
#
# Provenance key: salient_stated (S), third_party_stated (T),
# added_by_analysis (A). The provenance comes from the BUILD_SPEC inventory;
# provenance_url is null where the page URL was not captured.
#
# `change_source` is a list when a row is monitored through more than one
# channel ("FR + eCFR" in the inventory).
# `ecfr` names the part (and optional section filter) the diff step watches.
# Optional fields: cross_cutting (applies to all conduct), notes.

rows:
  # ---------------------------------------------------------------- TCPA (Tier 1)
  - id: TCPA-CONSENT-001
    law: "Telephone Consumer Protection Act"
    citation: "47 USC 227(b)(1); 47 CFR 64.1200(a)(1)-(3)"
    source_url: "https://www.ecfr.gov/current/title-47/section-64.1200"
    agency: FCC
    jurisdiction: federal
    applies_to: [all_callers]
    tier: 1
    behavior_classes: [CONTACT.CONSENT]
    constraint: "Calls to wireless numbers using an autodialer or an artificial or prerecorded voice require the called party's prior express consent (prior express written consent if the call includes telemarketing). Artificial or prerecorded voice calls to residential lines require consent unless an exemption applies."
    change_source: [federal_register, ecfr]
    ecfr: {title: 47, part: 64, section: "64.1200"}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null

  - id: TCPA-AIVOICE-001
    law: "Telephone Consumer Protection Act"
    citation: "FCC Declaratory Ruling, FCC 24-17, CG Docket No. 23-362 (released Feb. 8, 2024) (verify cite)"
    source_url: "https://docs.fcc.gov/public/attachments/FCC-24-17A1.pdf"
    agency: FCC
    jurisdiction: federal
    applies_to: [all_callers]
    tier: 1
    behavior_classes: [CONTACT.CONSENT]
    constraint: "Voices generated by AI technologies are 'artificial or prerecorded voice' under 47 USC 227(b). An AI voice agent placing outbound calls needs the consent that the TCPA requires for artificial-voice calls."
    change_source: [federal_register]
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2024-02-08
    last_checked: null
    notes: "BUILD_SPEC flags this citation as 'verify cite'. Effective date assumes a declaratory ruling is effective on release; confirm."

  - id: TCPA-REVOKE-001
    law: "Telephone Consumer Protection Act"
    citation: "47 CFR 64.1200(a)(10)-(12) (paragraph numbers: verify); FCC 24-24, CG Docket No. 02-278"
    source_url: "https://www.ecfr.gov/current/title-47/section-64.1200"
    agency: FCC
    jurisdiction: federal
    applies_to: [all_callers]
    tier: 1
    behavior_classes: [CONTACT.CONSENT, STOP.TRIGGERS]
    constraint: "A called party may revoke consent by any reasonable means. The caller must honor the revocation within a reasonable time, not to exceed 10 business days. A one-time text confirming the opt-out is allowed within 5 minutes of the request."
    change_source: [federal_register, ecfr]
    ecfr: {title: 47, part: 64, section: "64.1200"}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2025-04-11
    last_checked: null
    notes: "The FCC delayed the provision that applies a revocation to unrelated calls and texts from the same caller ('revoke-all'). Check its current effective date against the latest FCC order."

  # ------------------------------------------------------ FDCPA / Reg F (Tier 1)
  - id: REGF-TIME-001
    law: "FDCPA / Regulation F"
    citation: "15 USC 1692c(a)(1); 12 CFR 1006.6(b)(1)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.6"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [CONTACT.TIMING]
    constraint: "Do not communicate or attempt to communicate at a time or place the collector knows or should know is inconvenient. Absent contrary knowledge, 8:00 a.m. to 9:00 p.m. local time at the consumer's location is presumed convenient."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-TIME-002
    law: "FDCPA / Regulation F"
    citation: "15 USC 1692c(a)(3); 12 CFR 1006.6(b)(3)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.6"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [CONTACT.TIMING]
    constraint: "Do not communicate at the consumer's place of employment if the collector knows or has reason to know the employer prohibits such communications."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-FREQ-001
    law: "FDCPA / Regulation F"
    citation: "12 CFR 1006.14(b)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.14"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [CONTACT.FREQUENCY]
    constraint: "Presumed violation if >7 call attempts in 7 days, or a call within 7 days after a phone conversation, about a particular debt."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-MEDIA-001
    law: "FDCPA / Regulation F"
    citation: "12 CFR 1006.14(h); 12 CFR 1006.6(e)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.14"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [CONTACT.CONSENT, STOP.TRIGGERS]
    constraint: "Do not communicate through a medium the consumer has asked the collector not to use. Each electronic communication (email, text) must include a clear and conspicuous way to opt out of further electronic communications to that address or number."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-DISC-001
    law: "FDCPA / Regulation F"
    citation: "15 USC 1692g(a); 12 CFR 1006.34"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.34"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [DISCLOSURE.REQUIRED]
    constraint: "Provide validation information in the initial communication or within 5 days after it (debt details, itemization, consumer rights, dispute response mechanisms)."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-DISC-002
    law: "FDCPA / Regulation F"
    citation: "15 USC 1692e(11); 12 CFR 1006.18(e)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.18"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [DISCLOSURE.REQUIRED]
    constraint: "In the initial communication, disclose that the collector is attempting to collect a debt and that any information obtained will be used for that purpose. In later communications, disclose that the communication is from a debt collector. A limited-content message is excepted."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-IDENT-001
    law: "FDCPA / Regulation F"
    citation: "15 USC 1692b, 1692c(b); 12 CFR 1006.6(d), 1006.10; 12 CFR 1006.2(j)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.6"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [IDENTITY.RIGHT_PARTY]
    constraint: "Do not discuss the debt with anyone other than the consumer (or the consumer's spouse, attorney, and other listed persons) without consent. Contacts with third parties to acquire location information are limited in content and frequency. A limited-content message that meets 1006.2(j) is not a communication."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-STOP-001
    law: "FDCPA / Regulation F"
    citation: "15 USC 1692c(c); 12 CFR 1006.6(c)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.6"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [STOP.TRIGGERS]
    constraint: "After a written notice refusing to pay or requesting that communication cease, stop communicating about the debt except for the limited notices the rule permits."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-STOP-002
    law: "FDCPA / Regulation F"
    citation: "15 USC 1692c(a)(2); 12 CFR 1006.6(b)(2)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.6"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [STOP.TRIGGERS]
    constraint: "If the collector knows the consumer is represented by an attorney with respect to the debt, communicate with the attorney, not the consumer, unless the attorney fails to respond or consents."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-STOP-003
    law: "FDCPA / Regulation F"
    citation: "15 USC 1692g(b); 12 CFR 1006.38(d)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.38"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [STOP.TRIGGERS]
    constraint: "After a timely dispute (or a request for original-creditor information) during the validation period, stop collecting the debt until verification (or the requested information) has been provided."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-FEES-001
    law: "FDCPA / Regulation F"
    citation: "15 USC 1692f(1); 12 CFR 1006.22(b)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.22"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [PAYMENT.FEES]
    constraint: "Do not collect any amount, including a convenience or pay-to-pay fee, unless the agreement creating the debt expressly authorizes it or law permits it."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null
    notes: "CFPB issued an advisory opinion on pay-to-pay fees in 2022. Check whether it was among the guidance documents CFPB withdrew in 2025 before citing it."

  # ------------------------------------------------------------- UDAAP / FTC (T1)
  - id: UDAAP-001
    law: "Consumer Financial Protection Act (UDAAP)"
    citation: "12 USC 5531, 5536(a)(1)(B)"
    source_url: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title12-section5531&num=0&edition=prelim"
    agency: CFPB
    jurisdiction: federal
    applies_to: [covered_persons, service_providers]
    tier: 1
    behavior_classes: [NEGOTIATION.TREATMENT]
    cross_cutting: true
    constraint: "Covered persons and service providers may not engage in unfair, deceptive, or abusive acts or practices. Settlement, extension and deferral offers, and every other agent statement, must be accurate and not misleading, and must not exploit a consumer's lack of understanding."
    change_source: [federal_register]
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null

  - id: FTC5-001
    law: "FTC Act Section 5"
    citation: "15 USC 45(a)"
    source_url: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title15-section45&num=0&edition=prelim"
    agency: FTC
    jurisdiction: federal
    applies_to: [nonbank_financial_companies]
    tier: 1
    behavior_classes: [NEGOTIATION.TREATMENT]
    cross_cutting: true
    constraint: "Unfair or deceptive acts or practices in or affecting commerce are unlawful. The FTC enforces against nonbanks; banks are outside its Section 5 jurisdiction."
    change_source: [federal_register]
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null
    notes: "Provenance per BUILD_SPEC: FTC named as regulator."

  # ------------------------------------------------------------- EFTA / Reg E (T1)
  - id: REGE-PREAUTH-001
    law: "EFTA / Regulation E"
    citation: "15 USC 1693e(a); 12 CFR 1005.10(b)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1005.10"
    agency: CFPB
    jurisdiction: federal
    applies_to: [financial_institutions, creditors]
    tier: 1
    behavior_classes: [PAYMENT.AUTHORIZATION]
    constraint: "Preauthorized (recurring) electronic fund transfers from a consumer's account may be authorized only by a writing signed or similarly authenticated by the consumer. The person obtaining the authorization must give the consumer a copy."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1005}
    provenance: added_by_analysis
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null

  - id: REGE-PREAUTH-002
    law: "EFTA / Regulation E"
    citation: "15 USC 1693k; 12 CFR 1005.10(e)(1)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1005.10"
    agency: CFPB
    jurisdiction: federal
    applies_to: [financial_institutions, creditors]
    tier: 1
    behavior_classes: [PAYMENT.AUTHORIZATION, NEGOTIATION.TREATMENT]
    constraint: "Do not condition an extension of credit on repayment by preauthorized electronic fund transfers (limited exceptions apply). An agent must not present autopay as mandatory for a modification or extension."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1005}
    provenance: added_by_analysis
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null

  # ------------------------------------------------------------------ Nacha (T1)
  - id: NACHA-TEL-001
    law: "Nacha Operating Rules (TEL entries)"
    citation: "Nacha Operating Rules, Telephone-Initiated Entries (TEL)"
    source_url: "https://www.nacha.org/rules"
    agency: Nacha
    jurisdiction: federal
    applies_to: [ach_originators]
    tier: 1
    behavior_classes: [PAYMENT.AUTHORIZATION]
    constraint: "A TEL debit needs the consumer's oral authorization over the phone. The Originator must either record the oral authorization or send written notice confirming it before settlement, and keep that evidence for the required retention period."
    change_source: [manual]
    provenance: added_by_analysis
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null
    notes: "The rulebook is licensed, not public; source_url is Nacha's rules page. Recent amendments changed recurring TEL entries; confirm against the current rulebook."

  - id: NACHA-WEB-001
    law: "Nacha Operating Rules (WEB entries)"
    citation: "Nacha Operating Rules, Internet-Initiated/Mobile Entries (WEB)"
    source_url: "https://www.nacha.org/rules"
    agency: Nacha
    jurisdiction: federal
    applies_to: [ach_originators]
    tier: 1
    behavior_classes: [PAYMENT.AUTHORIZATION]
    constraint: "WEB debits need consumer authorization obtained online. The Originator must use a commercially reasonable fraudulent-transaction detection system that includes account validation for the first use of an account number."
    change_source: [manual]
    provenance: added_by_analysis
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null

  - id: NACHA-FRAUD-001
    law: "Nacha Operating Rules (fraud monitoring)"
    citation: "Nacha Operating Rules, 2024 Risk Management amendments (fraud monitoring by non-consumer Originators, ODFIs, and others) (verify)"
    source_url: "https://www.nacha.org/rules"
    agency: Nacha
    jurisdiction: federal
    applies_to: [ach_originators]
    tier: 1
    behavior_classes: [PAYMENT.AUTHORIZATION, VENDOR.GOVERNANCE]
    constraint: "Participants must maintain risk-based processes to identify ACH entries that are unauthorized or authorized under false pretenses. Phased implementation dates were set in 2026."
    change_source: [manual]
    provenance: added_by_analysis
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null
    notes: "Confirm the amendment name, phase dates, and which participant types each phase reaches."

  # ------------------------------------------------------------- Bankruptcy (T1)
  - id: BK-STAY-001
    law: "Bankruptcy Code (automatic stay)"
    citation: "11 USC 362(a)"
    source_url: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title11-section362&num=0&edition=prelim"
    agency: statute
    jurisdiction: federal
    applies_to: [all_persons]
    tier: 1
    behavior_classes: [STOP.TRIGGERS, RECOVERY.REPOSSESSION]
    constraint: "Once a bankruptcy petition is filed, acts to collect a prepetition claim or to take possession of estate property are stayed. On notice of a filing, collection contact and repossession activity must stop unless relief from stay is obtained."
    change_source: [manual]
    provenance: added_by_analysis
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null

  - id: BK-DISCH-001
    law: "Bankruptcy Code (discharge injunction)"
    citation: "11 USC 524(a)(2)"
    source_url: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title11-section524&num=0&edition=prelim"
    agency: statute
    jurisdiction: federal
    applies_to: [all_persons]
    tier: 1
    behavior_classes: [STOP.TRIGGERS]
    constraint: "A discharge enjoins any act to collect a discharged debt as a personal liability of the debtor. Reaffirmed debts and in-rem rights are handled separately."
    change_source: [manual]
    provenance: added_by_analysis
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null

  # =============================================================== Tier 2
  - id: FCRA-DIRECT-001
    law: "FCRA / Regulation V"
    citation: "15 USC 1681s-2(a)(8); 12 CFR 1022.43"
    source_url: "https://www.ecfr.gov/current/title-12/section-1022.43"
    agency: CFPB
    jurisdiction: federal
    applies_to: [furnishers]
    tier: 2
    behavior_classes: [DISPUTES.CREDIT_REPORTING]
    constraint: "A furnisher must investigate a qualifying direct dispute about the accuracy of furnished information and report the results to the consumer, generally within 30 days."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1022}
    provenance: third_party_stated
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null

  - id: FCRA-ACCURACY-001
    law: "FCRA / Regulation V"
    citation: "15 USC 1681s-2(a)(1)-(3); 12 CFR 1022.42"
    source_url: "https://www.ecfr.gov/current/title-12/section-1022.42"
    agency: CFPB
    jurisdiction: federal
    applies_to: [furnishers]
    tier: 2
    behavior_classes: [DISPUTES.CREDIT_REPORTING]
    constraint: "Furnishers must keep reasonable written policies and procedures for the accuracy and integrity of furnished information. When a consumer disputes information, the furnisher must report that the information is disputed."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1022}
    provenance: third_party_stated
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null

  - id: REGB-001
    law: "ECOA / Regulation B"
    citation: "15 USC 1691(a); 12 CFR 1002.4(a); 12 CFR 1002.2(m)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1002.4"
    agency: CFPB
    jurisdiction: federal
    applies_to: [creditors]
    tier: 2
    behavior_classes: [NEGOTIATION.TREATMENT]
    constraint: "Do not discriminate on a prohibited basis in any aspect of a credit transaction. 'Credit transaction' includes collection procedures, so treatment offers (extensions, deferrals, settlements) must not vary on a prohibited basis."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1002}
    provenance: added_by_analysis
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null

  - id: REGZ-MOD-001
    law: "TILA / Regulation Z"
    citation: "12 CFR 1026.20(a)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1026.20"
    agency: CFPB
    jurisdiction: federal
    applies_to: [creditors]
    tier: 2
    behavior_classes: [ACCOUNT.MODIFICATION]
    constraint: "For closed-end credit, a refinancing (an existing obligation satisfied and replaced by a new one) is a new transaction requiring new disclosures. Listed changes such as workout agreements for delinquency or default are not refinancings. An agent offering a modification must not create an undisclosed refinancing."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1026}
    provenance: added_by_analysis
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null

  - id: SCRA-RATE-001
    law: "Servicemembers Civil Relief Act"
    citation: "50 USC 3937"
    source_url: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title50-section3937&num=0&edition=prelim"
    agency: "statute (DOJ)"
    jurisdiction: federal
    applies_to: [creditors]
    tier: 2
    behavior_classes: [STOP.TRIGGERS, NEGOTIATION.TREATMENT]
    constraint: "Obligations a servicemember incurred before military service are capped at 6% interest during service, on written notice and a copy of orders. An agent told of military service must route the account for SCRA handling."
    change_source: [manual]
    provenance: added_by_analysis
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null

  - id: SCRA-REPO-001
    law: "Servicemembers Civil Relief Act"
    citation: "50 USC 3952"
    source_url: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title50-section3952&num=0&edition=prelim"
    agency: "statute (DOJ)"
    jurisdiction: federal
    applies_to: [creditors, secured_parties]
    tier: 2
    behavior_classes: [STOP.TRIGGERS, RECOVERY.REPOSSESSION]
    constraint: "For an installment contract entered into before military service on which a deposit or installment was paid before service, the creditor may not repossess during service without a court order."
    change_source: [manual]
    provenance: added_by_analysis
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null

  - id: GLBA-REGP-001
    law: "GLBA / Regulation P"
    citation: "15 USC 6801-6809; 12 CFR 1016"
    source_url: "https://www.ecfr.gov/current/title-12/part-1016"
    agency: CFPB
    jurisdiction: federal
    applies_to: [financial_institutions]
    tier: 2
    behavior_classes: [DATA.PRIVACY_SECURITY]
    constraint: "Provide privacy notices, and limit disclosure of nonpublic personal information to nonaffiliated third parties except under an exception (e.g., the service-provider exception in 1016.13)."
    change_source: [federal_register, ecfr]
