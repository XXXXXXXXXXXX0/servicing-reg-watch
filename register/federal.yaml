# Federal register rows (BUILD_SPEC Sections 4 and 6).
#
# Every row cites a primary source. Every row is `status: verify`: the
# citations, constraint summaries and effective dates were drafted from
# working knowledge of the law without network access to the primary text,
# and must be checked against the linked primary source before they are
# relied on. `last_checked` stays null until someone does that check.
#
# Provenance key: salient_stated (S), third_party_stated (T),
# added_by_analysis (A). The provenance comes from the BUILD_SPEC inventory;
# provenance_url is null where the page URL was not captured.
#
# `change_source` is a list when a row is monitored through more than one
# channel ("FR + eCFR" in the inventory).
# `ecfr` names the part (and optional section filter) the diff step watches.
# Optional fields: cross_cutting (applies to all conduct), notes.

rows:
  # ---------------------------------------------------------------- TCPA (Tier 1)
  - id: TCPA-CONSENT-001
    law: "Telephone Consumer Protection Act"
    citation: "47 USC 227(b)(1); 47 CFR 64.1200(a)(1)-(3)"
    source_url: "https://www.ecfr.gov/current/title-47/section-64.1200"
    agency: FCC
    jurisdiction: federal
    applies_to: [all_callers]
    tier: 1
    behavior_classes: [CONTACT.CONSENT]
    constraint: "Calls to wireless numbers using an autodialer or an artificial or prerecorded voice require the called party's prior express consent (prior express written consent if the call includes telemarketing). Artificial or prerecorded voice calls to residential lines require consent unless an exemption applies."
    change_source: [federal_register, ecfr]
    ecfr: {title: 47, part: 64, section: "64.1200"}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null

  - id: TCPA-AIVOICE-001
    law: "Telephone Consumer Protection Act"
    citation: "FCC Declaratory Ruling, FCC 24-17, CG Docket No. 23-362 (released Feb. 8, 2024) (verify cite)"
    source_url: "https://docs.fcc.gov/public/attachments/FCC-24-17A1.pdf"
    agency: FCC
    jurisdiction: federal
    applies_to: [all_callers]
    tier: 1
    behavior_classes: [CONTACT.CONSENT]
    constraint: "Voices generated by AI technologies are 'artificial or prerecorded voice' under 47 USC 227(b). An AI voice agent placing outbound calls needs the consent that the TCPA requires for artificial-voice calls."
    change_source: [federal_register]
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2024-02-08
    last_checked: null
    notes: "BUILD_SPEC flags this citation as 'verify cite'. Effective date assumes a declaratory ruling is effective on release; confirm."

  - id: TCPA-REVOKE-001
    law: "Telephone Consumer Protection Act"
    citation: "47 CFR 64.1200(a)(10)-(12) (paragraph numbers: verify); FCC 24-24, CG Docket No. 02-278"
    source_url: "https://www.ecfr.gov/current/title-47/section-64.1200"
    agency: FCC
    jurisdiction: federal
    applies_to: [all_callers]
    tier: 1
    behavior_classes: [CONTACT.CONSENT, STOP.TRIGGERS]
    constraint: "A called party may revoke consent by any reasonable means. The caller must honor the revocation within a reasonable time, not to exceed 10 business days. A one-time text confirming the opt-out is allowed within 5 minutes of the request."
    change_source: [federal_register, ecfr]
    ecfr: {title: 47, part: 64, section: "64.1200"}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2025-04-11
    last_checked: null
    notes: "The FCC delayed the provision that applies a revocation to unrelated calls and texts from the same caller ('revoke-all'). Check its current effective date against the latest FCC order."

  # ------------------------------------------------------ FDCPA / Reg F (Tier 1)
  - id: REGF-TIME-001
    law: "FDCPA / Regulation F"
    citation: "15 USC 1692c(a)(1); 12 CFR 1006.6(b)(1)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.6"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [CONTACT.TIMING]
    constraint: "Do not communicate or attempt to communicate at a time or place the collector knows or should know is inconvenient. Absent contrary knowledge, 8:00 a.m. to 9:00 p.m. local time at the consumer's location is presumed convenient."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-TIME-002
    law: "FDCPA / Regulation F"
    citation: "15 USC 1692c(a)(3); 12 CFR 1006.6(b)(3)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.6"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [CONTACT.TIMING]
    constraint: "Do not communicate at the consumer's place of employment if the collector knows or has reason to know the employer prohibits such communications."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-FREQ-001
    law: "FDCPA / Regulation F"
    citation: "12 CFR 1006.14(b)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.14"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [CONTACT.FREQUENCY]
    constraint: "Presumed violation if >7 call attempts in 7 days, or a call within 7 days after a phone conversation, about a particular debt."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-MEDIA-001
    law: "FDCPA / Regulation F"
    citation: "12 CFR 1006.14(h); 12 CFR 1006.6(e)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.14"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [CONTACT.CONSENT, STOP.TRIGGERS]
    constraint: "Do not communicate through a medium the consumer has asked the collector not to use. Each electronic communication (email, text) must include a clear and conspicuous way to opt out of further electronic communications to that address or number."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-DISC-001
    law: "FDCPA / Regulation F"
    citation: "15 USC 1692g(a); 12 CFR 1006.34"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.34"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [DISCLOSURE.REQUIRED]
    constraint: "Provide validation information in the initial communication or within 5 days after it (debt details, itemization, consumer rights, dispute response mechanisms)."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-DISC-002
    law: "FDCPA / Regulation F"
    citation: "15 USC 1692e(11); 12 CFR 1006.18(e)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.18"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [DISCLOSURE.REQUIRED]
    constraint: "In the initial communication, disclose that the collector is attempting to collect a debt and that any information obtained will be used for that purpose. In later communications, disclose that the communication is from a debt collector. A limited-content message is excepted."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-IDENT-001
    law: "FDCPA / Regulation F"
    citation: "15 USC 1692b, 1692c(b); 12 CFR 1006.6(d), 1006.10; 12 CFR 1006.2(j)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.6"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [IDENTITY.RIGHT_PARTY]
    constraint: "Do not discuss the debt with anyone other than the consumer (or the consumer's spouse, attorney, and other listed persons) without consent. Contacts with third parties to acquire location information are limited in content and frequency. A limited-content message that meets 1006.2(j) is not a communication."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-STOP-001
    law: "FDCPA / Regulation F"
    citation: "15 USC 1692c(c); 12 CFR 1006.6(c)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.6"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [STOP.TRIGGERS]
    constraint: "After a written notice refusing to pay or requesting that communication cease, stop communicating about the debt except for the limited notices the rule permits."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-STOP-002
    law: "FDCPA / Regulation F"
    citation: "15 USC 1692c(a)(2); 12 CFR 1006.6(b)(2)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.6"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [STOP.TRIGGERS]
    constraint: "If the collector knows the consumer is represented by an attorney with respect to the debt, communicate with the attorney, not the consumer, unless the attorney fails to respond or consents."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-STOP-003
    law: "FDCPA / Regulation F"
    citation: "15 USC 1692g(b); 12 CFR 1006.38(d)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.38"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [STOP.TRIGGERS]
    constraint: "After a timely dispute (or a request for original-creditor information) during the validation period, stop collecting the debt until verification (or the requested information) has been provided."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null

  - id: REGF-FEES-001
    law: "FDCPA / Regulation F"
    citation: "15 USC 1692f(1); 12 CFR 1006.22(b)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.22"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [PAYMENT.FEES]
    constraint: "Do not collect any amount, including a convenience or pay-to-pay fee, unless the agreement creating the debt expressly authorizes it or law permits it."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: 2021-11-30
    last_checked: null
    notes: "CFPB issued an advisory opinion on pay-to-pay fees in 2022. Check whether it was among the guidance documents CFPB withdrew in 2025 before citing it."

  # ------------------------------------------------------------- UDAAP / FTC (T1)
  - id: UDAAP-001
    law: "Consumer Financial Protection Act (UDAAP)"
    citation: "12 USC 5531, 5536(a)(1)(B)"
    source_url: "https://uscode.house.gov/view.xhtml?req=granuleid:USC-prelim-title12-section5531&num=0&edition=prelim"
