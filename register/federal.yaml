      result: match
      date: '2026-09-27'
      sources:
      - data/raw/govinfo/2026-16029.htm.gz
      - data/raw/ecfr/2026-09-24_title-12.xml_part-701_section-701.21.gz
      - data/raw/ecfr/2026-09-24_title-12.xml_part-741_section-741.203.gz
      note: FR Doc. 2026-16029 states the former limits (50 percent of net worth, 100 percent after 30 months) and the September 8, 2026 effective date. eCFR as of 2026-09-24 shows no indirect-vehicle servicing limit in 701.21 and no paragraph (c) in 741.203 (amended at 91 FR 50680).
    preemption:
      type: not_applicable
      note: The row records the removal of a federal limit; no federal requirement remains to preempt or be preempted.

