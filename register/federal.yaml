  - id: NCUA-RECORDS-001
    law: "NCUA vital records preservation program (record retention guidelines removed)"
    citation: "12 CFR 749.0-749.5, as revised by NCUA final rule, 91 FR 36073 (June 16, 2026), FR Doc. 2026-12058, effective July 16, 2026"
    source_url: "https://www.govinfo.gov/content/pkg/FR-2026-06-16/html/2026-12058.htm"
    agency: NCUA
    jurisdiction: federal
    applies_to: [credit_unions]
    tier: 2
    behavior_classes: [RECORDS.RETENTION]
    constraint: "A federally insured credit union's board must keep a written vital records preservation program with designated staff, a schedule for storing and destroying vital records, and a records preservation log, and must keep duplicate vital records at a vital records center (749.2(a)). Vital records are the current versions of the records needed to restore vital member services: member share, deposit and loan balances as of the most recent business day, and month-end financial report, bank reconcilements and list of accounts, insurance policies and investments, plus emergency contacts (749.1). A credit union using a third-party service provider for its records must oversee it (749.3). Records other NCUA rules require may be kept in any format that accurately reflects them, stays accessible and can be reproduced, with equipment or software for examiner access (749.5). The part does not supersede records preservation requirements under other law (749.0(b)). The rule removed Appendix A (Record Retention Guidelines) and 12 CFR 703.105(d), so the CFR no longer suggests retention periods for credit union records."
    change_source: [federal_register]
    provenance: added_by_analysis
    provenance_url: null
