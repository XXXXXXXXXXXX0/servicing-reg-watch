    agency: FTC
    jurisdiction: federal
    applies_to: [holders]
    tier: 2
    behavior_classes: [DISPUTES.CLAIMS_DEFENSES]
    constraint: "A seller (e.g. a dealer) may not take or receive a consumer credit contract, or accept purchase-money loan proceeds, unless the contract contains the notice that any holder is subject to all claims and defenses the debtor could assert against the seller, with recovery capped at amounts paid. The rule binds sellers; a holder (bank, credit union, captive or specialty lender that buys the contract) is bound through that contract term. Agents handling disputes on dealer-originated contracts must treat seller-conduct claims as assertable against the holder."
