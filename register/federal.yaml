    tier: 2
    behavior_classes: [NEGOTIATION.TREATMENT]
    constraint: "Do not discriminate on a prohibited basis in any aspect of a credit transaction. 'Credit transaction' includes collection procedures, so treatment offers (extensions, deferrals, settlements) must not vary on a prohibited basis."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1002}
    provenance: added_by_analysis
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null

  - id: REGZ-MOD-001
    law: "TILA / Regulation Z"
    citation: "12 CFR 1026.20(a)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1026.20"
    agency: CFPB
    jurisdiction: federal
    applies_to: [creditors]
    tier: 2
    behavior_classes: [ACCOUNT.MODIFICATION]
    constraint: "For closed-end credit, a refinancing (an existing obligation satisfied and replaced by a new one) is a new transaction requiring new disclosures. Listed changes such as workout agreements for delinquency or default are not refinancings. An agent offering a modification must not create an undisclosed refinancing."
