# Federal register rows (BUILD_SPEC Sections 4 and 6).
#
# Every row cites a primary source. Every row is `status: verify`: the
# citations, constraint summaries and effective dates were drafted from
# working knowledge of the law without network access to the primary text,
# and must be checked against the linked primary source before they are
# relied on. `last_checked` stays null until someone does that check.
#
# Provenance key: salient_stated (S), third_party_stated (T),
# added_by_analysis (A). The provenance comes from the BUILD_SPEC inventory;
# provenance_url is null where the page URL was not captured.
#
# `change_source` is a list when a row is monitored through more than one
# channel ("FR + eCFR" in the inventory).
# `ecfr` names the part (and optional section filter) the diff step watches.
# Optional fields: cross_cutting (applies to all conduct), notes.

rows:
  # ---------------------------------------------------------------- TCPA (Tier 1)
  - id: TCPA-CONSENT-001
    law: "Telephone Consumer Protection Act"
    citation: "47 USC 227(b)(1); 47 CFR 64.1200(a)(1)-(3)"
    source_url: "https://www.ecfr.gov/current/title-47/section-64.1200"
    agency: FCC
    jurisdiction: federal
    applies_to: [all_callers]
    tier: 1
    behavior_classes: [CONTACT.CONSENT]
    constraint: "Calls to wireless numbers using an autodialer or an artificial or prerecorded voice require the called party's prior express consent (prior express written consent if the call includes telemarketing). Artificial or prerecorded voice calls to residential lines require consent unless an exemption applies."
    change_source: [federal_register, ecfr]
    ecfr: {title: 47, part: 64, section: "64.1200"}
    provenance: salient_stated
    provenance_url: null
    status: machine_verified
    effective_date: null
    last_checked: null
    machine_check:
      result: match
      date: '2026-09-27'
      sources:
      - data/raw/primary/uscode/title47-section227.htm.gz
      - data/raw/ecfr/2026-09-24_title-47.xml_part-64_section-64.1200.gz
      note: 47 USC 227(b)(1)(A)(iii) and (B); 47 CFR 64.1200(a)(1)-(3) confirmed. The residential-line consent exemptions are the numerical limits in 64.1200(a)(3)(ii)-(v).
    preemption:
      type: mixed
      citation: 47 USC 227(f)(1)
      quote: Except for the standards prescribed under subsection (d) and subject to paragraph (2) of this subsection, nothing in this section or in the regulations prescribed under this section shall preempt any State law that imposes more restrictive intrastate requirements or regulations on, or which prohibits- ... (B) the use of automatic telephone dialing systems; (C) the use of artificial or prerecorded voice messages; or (D) the making of telephone solicitations.
      sources:
      - data/raw/primary/uscode/title47-section227.htm.gz
      note: Saves more restrictive state rules on intrastate calls; the text does not address state rules on interstate calls, and the subsection (d) technical standards are excluded from the savings clause. 47 CFR 64.1200 has no separate state-law provision.

  - id: TCPA-AIVOICE-001
    law: "Telephone Consumer Protection Act"
    citation: "FCC, Implications of Artificial Intelligence Technologies on Protecting Consumers From Unwanted Robocalls and Robotexts (proposed rule), 89 FR 73321 (Sept. 10, 2024), FR Doc. 2024-19028, CG Docket No. 23-362, stating the Commission's AI Declaratory Ruling"
    source_url: "https://www.govinfo.gov/content/pkg/FR-2024-09-10/html/2024-19028.htm"
    agency: FCC
    jurisdiction: federal
    applies_to: [all_callers]
    tier: 1
    behavior_classes: [CONTACT.CONSENT]
    constraint: "Voices generated by AI technologies are 'artificial or prerecorded voice' under 47 USC 227(b). An AI voice agent placing outbound calls needs the consent that the TCPA requires for artificial-voice calls."
    change_source: [federal_register]
    provenance: salient_stated
    provenance_url: null
    status: machine_verified
    effective_date: null
    last_checked: null
    notes: "Holding and docket confirmed from the FCC's Federal Register notice FR Doc. 2024-19028 (committed GovInfo text): 'the AI Declaratory Ruling in which the Commission found that AI and other technologies that generate human voices fall within the TCPA' and 'the Commission has already determined that voice cloning and similar technologies qualify under that statutory phrase' ('artificial or prerecorded voice'). The ruling's own document number and release date could not be confirmed (docs.fcc.gov not reachable) and are not cited (reviewer decision 2026-09-27)."
    machine_check:
      result: match
      date: '2026-09-27'
      sources:
      - data/raw/govinfo/2024-19028.htm.gz
      note: 'Re-checked 2026-09-27 after the reviewer changed the citation to FR Doc. 2024-19028: the notice states the AI Declaratory Ruling''s holding and the docket (CG Docket No. 23-362). It is a proposed rule restating the ruling, not the ruling itself. Earlier result: not_checkable (FCC 24-17 on docs.fcc.gov blocked).'
    preemption:
      type: mixed
      citation: 47 USC 227(f)(1)
      quote: Except for the standards prescribed under subsection (d) and subject to paragraph (2) of this subsection, nothing in this section or in the regulations prescribed under this section shall preempt any State law that imposes more restrictive intrastate requirements or regulations on, or which prohibits- ... (B) the use of automatic telephone dialing systems; (C) the use of artificial or prerecorded voice messages; or (D) the making of telephone solicitations.
      sources:
      - data/raw/primary/uscode/title47-section227.htm.gz
      note: Saves more restrictive state rules on intrastate calls; the text does not address state rules on interstate calls, and the subsection (d) technical standards are excluded from the savings clause. 47 CFR 64.1200 has no separate state-law provision.

  - id: TCPA-REVOKE-001
    law: "Telephone Consumer Protection Act"
    citation: "47 CFR 64.1200(a)(10)-(12) (paragraph numbers: verify); FCC 24-24, CG Docket No. 02-278"
    source_url: "https://www.ecfr.gov/current/title-47/section-64.1200"
    agency: FCC
    jurisdiction: federal
    applies_to: [all_callers]
    tier: 1
    behavior_classes: [CONTACT.CONSENT, STOP.TRIGGERS]
    constraint: "A called party may revoke consent by any reasonable means. The caller must honor the revocation within a reasonable time, not to exceed 10 business days. A one-time text confirming the opt-out is allowed within 5 minutes of the request."
    change_source: [federal_register, ecfr]
    ecfr: {title: 47, part: 64, section: "64.1200"}
    provenance: salient_stated
    provenance_url: null
    status: machine_verified
    effective_date: 2025-04-11
    last_checked: null
    notes: "The FCC delayed the provision that applies a revocation to unrelated calls and texts from the same caller ('revoke-all'). Check its current effective date against the latest FCC order."
    machine_check:
      result: match
      date: '2026-09-27'
      sources:
      - data/raw/ecfr/2026-09-24_title-47.xml_part-64_section-64.1200.gz
      - data/raw/govinfo/2024-23605.htm.gz
      note: 'Paragraph numbers confirmed: 64.1200(a)(10) (any reasonable method; honor within 10 business days), (a)(11) (other means: rebuttable presumption), (a)(12) (one-time confirmation text). The 5-minute point is a presumption: a confirmation text sent within five minutes is presumed within consent; a later one needs a showing that the delay was reasonable. The eCFR text as of 2026-09-24 contains no provision applying a revocation to unrelated calls and texts (''revoke-all''), consistent with the row''s note that it was delayed.'
    preemption:
      type: mixed
      citation: 47 USC 227(f)(1)
      quote: Except for the standards prescribed under subsection (d) and subject to paragraph (2) of this subsection, nothing in this section or in the regulations prescribed under this section shall preempt any State law that imposes more restrictive intrastate requirements or regulations on, or which prohibits- ... (B) the use of automatic telephone dialing systems; (C) the use of artificial or prerecorded voice messages; or (D) the making of telephone solicitations.
      sources:
      - data/raw/primary/uscode/title47-section227.htm.gz
      note: Saves more restrictive state rules on intrastate calls; the text does not address state rules on interstate calls, and the subsection (d) technical standards are excluded from the savings clause. 47 CFR 64.1200 has no separate state-law provision.

  # ------------------------------------------------------ FDCPA / Reg F (Tier 1)
  - id: REGF-TIME-001
    law: "FDCPA / Regulation F"
    citation: "15 USC 1692c(a)(1); 12 CFR 1006.6(b)(1)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1006.6"
    agency: CFPB
    jurisdiction: federal
    applies_to: [third_party_collectors, post_default_servicers]
    tier: 1
    behavior_classes: [CONTACT.TIMING]
    constraint: "Do not communicate or attempt to communicate at a time or place the collector knows or should know is inconvenient. Absent contrary knowledge, 8:00 a.m. to 9:00 p.m. local time at the consumer's location is presumed convenient."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1006}
    provenance: salient_stated
    provenance_url: null
    status: machine_verified
    effective_date: 2021-11-30
    last_checked: null
    machine_check:
      result: match
      date: '2026-09-27'
      sources:
      - data/raw/primary/uscode/title15-section1692c.htm.gz
      - data/raw/ecfr/2026-09-24_title-12.xml_part-1006_section-1006.6.gz
      note: 'The presumption wording follows 15 USC 1692c(a)(1) (''shall assume that the convenient time ... is after 8 o''clock antemeridian and before 9 o''clock postmeridian''); 1006.6(b)(1)(i) states it the other way (''a time before 8:00 a.m. and after 9:00 p.m. ... is inconvenient''). Exceptions for consent or court permission: 1006.6(b)(4).'
    preemption:
      type: floor
      citation: 12 CFR 1006.104; 15 USC 1692n
      quote: For purposes of this section, a State law is not inconsistent with the Act or the corresponding provisions of this part if the protection such law affords any consumer is greater than the protection provided by the Act or the corresponding provisions of this part.
      sources:
      - data/raw/ecfr/2026-09-24_title-12.xml_part-1006_section-1006.104.gz
      - data/raw/primary/uscode/title15-section1692n.htm.gz
      note: 'Section number confirmed from the fetched text: 12 CFR 1006.104 (Relation to State laws).'

