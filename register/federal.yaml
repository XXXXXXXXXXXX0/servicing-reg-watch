    law: "Consumer Financial Protection Act (UDAAP): payoff and title delivery"
    citation: "12 USC 5531, as applied in CFPB Supervisory Highlights, Special Edition Auto Finance, 89 FR 83842 (Oct. 18, 2024), FR Doc. 2024-24093, secs. 2.3.2 and 2.4.6"
