    jurisdiction: federal
    applies_to: [financial_institutions, creditors]
    tier: 1
    behavior_classes: [PAYMENT.AUTHORIZATION]
    constraint: "Preauthorized (recurring) electronic fund transfers from a consumer's account may be authorized only by a writing signed or similarly authenticated by the consumer. The person obtaining the authorization must give the consumer a copy."
