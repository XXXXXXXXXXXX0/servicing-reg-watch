  # ------------------------------------- Disputes: billing errors, chargebacks
  - id: REGZ-BILLERR-001
    law: "TILA / Regulation Z (billing error resolution)"
    citation: "12 CFR 1026.13"
    source_url: "https://www.ecfr.gov/current/title-12/section-1026.13"
    agency: CFPB
    jurisdiction: federal
    applies_to: [card_issuers_open_end_creditors]
    tier: 2
    behavior_classes: [DISPUTES.ERROR_RESOLUTION, STOP.TRIGGERS, DISPUTES.CREDIT_REPORTING]
    constraint: "Open-end credit (including credit card) billing errors: a written billing error notice received within 60 days of the first periodic statement showing the error must be acknowledged within 30 days and resolved within 2 complete billing cycles (no later than 90 days). Until resolved, the creditor may not try to collect the disputed amount or related charges, may not deduct it under an automatic payment plan, and may not report it or the account as delinquent (1026.13(d)). An agent taking a dispute must route it into this process and must not demand the disputed amount."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1026, section: "1026.13"}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null
    notes: "v1.2. TILA is named on the vendor's pages; card chargebacks are a named vendor line. 1026.13(i) routes credit incident to an EFT under an overdraft or minimum-balance agreement to Regulation E error resolution."

  - id: REGZ-CLAIMS-001
    law: "TILA / Regulation Z (card claims and defenses)"
    citation: "12 CFR 1026.12(c)"
    source_url: "https://www.ecfr.gov/current/title-12/section-1026.12"
    agency: CFPB
    jurisdiction: federal
    applies_to: [card_issuers_open_end_creditors]
    tier: 2
    behavior_classes: [DISPUTES.CLAIMS_DEFENSES, DISPUTES.CREDIT_REPORTING]
    constraint: "When a merchant fails to resolve a dispute over property or services bought with a credit card, the cardholder may assert claims (other than tort) and defenses against the card issuer and withhold payment up to the credit outstanding for that purchase; the issuer may not report the withheld amount as delinquent until the dispute is settled or judgment is rendered. Limits in 1026.12(c)(3) apply (good-faith attempt to resolve; over $50 and in-state or within 100 miles, unless an exclusion applies)."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1026, section: "1026.12"}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null
    notes: "v1.2."

  - id: REGE-ERR-001
    law: "EFTA / Regulation E (error resolution)"
    citation: "12 CFR 1005.11"
    source_url: "https://www.ecfr.gov/current/title-12/section-1005.11"
    agency: CFPB
    jurisdiction: federal
    applies_to: [account_holding_institutions]
    tier: 2
    behavior_classes: [DISPUTES.ERROR_RESOLUTION]
    constraint: "An oral or written notice of error (including an unauthorized EFT) received within 60 days of the periodic statement starts the clock: investigate and determine within 10 business days, or within 45 days with provisional credit given within 10 business days (20 business days / 90 days in the cases in 1005.11(c)(3)); report results within 3 business days; correct within 1 business day. An institution may require written confirmation of an oral notice within 10 business days only if it tells the consumer so, and where to send it, during the oral notice. An agent that hears an error assertion on a call is receiving an oral notice."
    change_source: [federal_register, ecfr]
    ecfr: {title: 12, part: 1005, section: "1005.11"}
    provenance: added_by_analysis
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null
    notes: "v1.2. Debit card chargebacks run through this process for the consumer's institution."

