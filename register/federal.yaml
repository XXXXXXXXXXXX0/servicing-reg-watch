  # ---------------------------------------------------- Military Lending Act
  - id: MLA-COVERED-001
    law: "Military Lending Act (covered borrower identification)"
    citation: "10 USC 987; 32 CFR 232.3(g), 232.5"
    source_url: "https://www.ecfr.gov/current/title-32/part-232"
    agency: DoD
    jurisdiction: federal
    applies_to: [creditors]
    tier: 2
    behavior_classes: [STOP.TRIGGERS, IDENTITY.RIGHT_PARTY]
    constraint: "Covered borrower status (active-duty member or dependent) is fixed when the consumer becomes obligated or opens the account (232.3(g)). A creditor may use the Department's database for a safe-harbor status check (232.5(b)), but may not use it after the transaction to look back at whether the consumer was a covered borrower when it was made (232.5(b)(2)(i)(B)). Consumer credit excludes credit expressly intended to finance a motor vehicle and secured by that vehicle (232.3(f)(2)(ii)), so purchase-money auto loans are generally outside the MLA; refinances and other consumer credit are not."
    change_source: [federal_register, ecfr]
    ecfr: {title: 32, part: 232}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null
    notes: "v1.2. 10 USC 987 is the part's authority line."

  - id: MLA-TERMS-001
    law: "Military Lending Act (terms and limitations)"
    citation: "10 USC 987; 32 CFR 232.4(b), 232.8"
    source_url: "https://www.ecfr.gov/current/title-32/part-232"
    agency: DoD
    jurisdiction: federal
    applies_to: [creditors]
    tier: 2
    behavior_classes: [NEGOTIATION.TREATMENT, PAYMENT.AUTHORIZATION, ACCOUNT.MODIFICATION]
    constraint: "For covered consumer credit: MAPR may not exceed 36 percent (232.4(b)). Unlawful to roll over, renew, refinance or consolidate with the same creditor's own credit (232.8(a), with exceptions); require waiver of legal recourse including SCRA rights (232.8(b)); require arbitration (232.8(c)); require an allotment to repay (232.8(g)); prohibit or penalize prepayment (232.8(h)); or use a check or account access as a condition, except as 232.8(e) permits (e.g., may require an EFT to repay at an MAPR within the cap). Agents offering modifications, refinances or payment methods to covered borrowers must stay inside these limits."
    change_source: [federal_register, ecfr]
    ecfr: {title: 32, part: 232}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null
    notes: "v1.2."

  - id: MLA-DISC-001
    law: "Military Lending Act (mandatory disclosures)"
    citation: "10 USC 987; 32 CFR 232.6"
    source_url: "https://www.ecfr.gov/current/title-32/part-232"
    agency: DoD
    jurisdiction: federal
    applies_to: [creditors]
    tier: 2
    behavior_classes: [DISCLOSURE.REQUIRED, ACCOUNT.MODIFICATION]
    constraint: "Before or at the time a covered borrower becomes obligated, provide the MAPR statement, the Regulation Z disclosures and a clear description of the payment obligation (232.6(a)). The MAPR statement and payment description must be given in writing and also orally (232.6(d)); oral delivery may be in person or by a toll-free number the borrower can call. A refinance or renewal needs new disclosures only when Regulation Z treats it as a new transaction (232.6(e))."
    change_source: [federal_register, ecfr]
    ecfr: {title: 32, part: 232}
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null
    notes: "v1.2. Oral disclosure duty is directly relevant to voice agents handling refinances."

  # ------------------------------------------------ Identity theft Red Flags
  - id: REDFLAG-FTC-001
    law: "FCRA Identity Theft Red Flags Rule (FTC)"
    citation: "15 USC 1681m(e); 16 CFR 681.1"
    source_url: "https://www.ecfr.gov/current/title-16/part-681"
    agency: FTC
    jurisdiction: federal
    applies_to: [nonbank_financial_companies]
    tier: 2
    behavior_classes: [IDENTITY.RIGHT_PARTY, DATA.PRIVACY_SECURITY]
    constraint: "A financial institution or creditor under FTC FCRA enforcement that offers or maintains covered accounts (including automobile loans) must have a written Identity Theft Prevention Program to detect, prevent and mitigate identity theft in connection with opening a covered account or any existing covered account (681.1(d)). Borrower verification by an agent is part of how red flags are detected on existing accounts."
    change_source: [federal_register, ecfr]
    ecfr: {title: 16, part: 681}
    provenance: added_by_analysis
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null
    notes: "v1.2. Scope per 681.1(a): entities subject to FTC FCRA enforcement under 15 USC 1681s(a)(1). 15 USC 1681m(e) is the part's authority line."

  - id: REDFLAG-BANK-001
    law: "FCRA Identity Theft Red Flags (bank and credit union agencies)"
    citation: "12 CFR 41.90 (OCC); 12 CFR 222.90 (Fed); 12 CFR 334.90 (FDIC); 12 CFR 717.90 (NCUA)"
    source_url: "https://www.ecfr.gov/current/title-12/section-41.90"
    agency: "OCC, FDIC, Fed, NCUA"
    jurisdiction: federal
    applies_to: [banks, credit_unions]
    tier: 2
    behavior_classes: [IDENTITY.RIGHT_PARTY, DATA.PRIVACY_SECURITY]
    constraint: "Each covered bank, savings association or federal credit union that offers or maintains covered accounts (e.g. automobile loans, credit card accounts) must develop and implement a written Identity Theft Prevention Program (paragraph (d) of each section) and administer it, including oversight of service provider arrangements (paragraph (e))."
    change_source: [federal_register]
    provenance: added_by_analysis
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null
    notes: "v1.2. 12 CFR 717.90 covers federal credit unions only; which rule covers state-chartered credit unions was not confirmed. Scope paragraphs (a) of each section confirmed."

  # ----------------------------------------------------------- FTC Holder Rule
  - id: HOLDER-001
    law: "FTC Holder Rule (preservation of consumers' claims and defenses)"
    citation: "16 CFR 433.2"
    source_url: "https://www.ecfr.gov/current/title-16/part-433"
    agency: FTC
    jurisdiction: federal
    applies_to: [holders]
    tier: 2
    behavior_classes: [DISPUTES.CLAIMS_DEFENSES]
    constraint: "A seller (e.g. a dealer) may not take or receive a consumer credit contract, or accept purchase-money loan proceeds, unless the contract contains the notice that any holder is subject to all claims and defenses the debtor could assert against the seller, with recovery capped at amounts paid. The rule binds sellers; a holder (bank, credit union, captive or specialty lender that buys the contract) is bound through that contract term. Agents handling disputes on dealer-originated contracts must treat seller-conduct claims as assertable against the holder."
    change_source: [federal_register, ecfr]
    ecfr: {title: 16, part: 433}
    provenance: added_by_analysis
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null
    notes: "v1.2."

