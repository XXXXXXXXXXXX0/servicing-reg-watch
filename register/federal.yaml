    tier: 2
    behavior_classes: [NEGOTIATION.TREATMENT, INSURANCE.CLAIMS]
    constraint: "Supervisory findings of unfair practices: excessive delay delivering vehicle titles after loan or lease payoff or on request to transfer registration out of state (sec. 2.3.2); failing to ensure refunds of unearned add-on product premiums on early payoff, repossession or total loss, which inflated payoff and deficiency balances (sec. 2.4.6). Payoff quotes should reflect refunds due, and post-payoff title release should be tracked to the lender's stated timeline."
