  # ---------------------------------------------------- Military Lending Act
  - id: MLA-COVERED-001
    law: "Military Lending Act (covered borrower identification)"
    citation: "10 USC 987; 32 CFR 232.3(g), 232.5"
    source_url: "https://www.ecfr.gov/current/title-32/part-232"
    agency: DoD
    jurisdiction: federal
    applies_to: [creditors]
    tier: 2
    behavior_classes: [STOP.TRIGGERS, IDENTITY.RIGHT_PARTY]
    constraint: "Covered borrower status (active-duty member or dependent) is fixed when the consumer becomes obligated or opens the account (232.3(g)). A creditor may use the Department's database for a safe-harbor status check (232.5(b)), but may not use it after the transaction to look back at whether the consumer was a covered borrower when it was made (232.5(b)(2)(i)(B)). Consumer credit excludes credit expressly intended to finance a motor vehicle and secured by that vehicle (232.3(f)(2)(ii)), so purchase-money auto loans are generally outside the MLA; refinances and other consumer credit are not."
    change_source: [federal_register, ecfr]
    ecfr: {title: 32, part: 232}
    provenance: salient_stated
    provenance_url: null
    status: machine_verified
    effective_date: null
    last_checked: null
    notes: "v1.2. 10 USC 987 is the part's authority line."
    machine_check:
      result: match
      date: '2026-09-27'
      sources:
      - data/raw/ecfr/2026-09-24_title-32.xml_part-232_section-232.3.gz
      - data/raw/ecfr/2026-09-24_title-32.xml_part-232_section-232.5.gz
      note: 232.3(g)(1), 232.5(b)(2)(i)(B) and 232.3(f)(2)(ii) confirmed. The statement that refinances are not excluded is the row's reading of 232.3(f)(2)(ii) ('expressly intended to finance the purchase of a motor vehicle'), not text in the rule.
    preemption:
      type: floor
      citation: 10 USC 987(d)(1); 32 CFR 232.7(a)
      quote: 10 U.S.C. 987 as implemented by this part preempts any State or Federal law, rule or regulation, including any State usury law, to the extent such law, rule or regulation is inconsistent with this part, except that any such law, rule or regulation is not preempted by this part to the extent that it provides protection to a covered borrower greater than those protections provided by 10 U.S.C. 987 and this part.
      sources:
      - data/raw/ecfr/2026-09-24_title-32.xml_part-232_section-232.7.gz
      - data/raw/primary/uscode/title10-section987.htm.gz
      note: 'Section number confirmed from the fetched text: 32 CFR 232.7 (Preemption). 232.7(b) also bars a state from authorizing higher rates for covered borrowers or waiving state protections because of military or nonresident status.'

