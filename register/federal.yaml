    constraint: "Covered persons and service providers may not engage in unfair, deceptive, or abusive acts or practices. Settlement, extension and deferral offers, and every other agent statement, must be accurate and not misleading, and must not exploit a consumer's lack of understanding."
    change_source: [federal_register]
    provenance: salient_stated
    provenance_url: null
    status: verify
    effective_date: null
    last_checked: null

